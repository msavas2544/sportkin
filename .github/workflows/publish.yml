# Publishes to PyPI when a GitHub release is published.
# Uses PyPI "trusted publishing": no API token is stored in the repository.
# One-time setup on pypi.org: add this repo + workflow as a trusted publisher.
name: publish

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
