# Publishes to PyPI. Uses PyPI "trusted publishing": no API token is stored here.
# One-time setup on pypi.org: add this repo + workflow as a trusted publisher,
# then switch the trigger below to `release: types: [published]`.
name: publish

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
